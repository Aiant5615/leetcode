name: Notify site
on:
  push:
    branches: [main]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the site's LeetCode sync (needs SITE_TOKEN secret)
        env:
          TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "SITE_TOKEN not set; the site will pick this up on its hourly sync."; exit 0; fi
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Aiant5615/Aiant5615.github.io/dispatches \
            -d '{"event_type":"leetcode"}' && echo "dispatched"
